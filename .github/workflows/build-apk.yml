name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat kerangka Android
        run: flutter create --project-name kamarku --org com.kamarku --platforms=android build_app

      - name: Salin kode Kamarku
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          sed -i 's/android:label="kamarku"/android:label="Kamarku"/' build_app/android/app/src/main/AndroidManifest.xml

      - name: Bangun APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kamarku-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
